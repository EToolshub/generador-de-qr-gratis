<head>

  h1 { font-size: clamp(28px, 6vw, 42px); letter-spacing: -.03em; margin: 0 0 8px; }
  p { color: #63636b; margin: 0 0 24px; }

  a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 12px;

  a:hover { background: #4338ca; color: #fff; border-color: #4338ca; }
